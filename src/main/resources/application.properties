# ---------- Dados do studio (personalize aqui) ----------
studio.nome=Ysa de Paula
studio.profissional=Ysa
studio.endereco=Rua Exemplo, 123 - Centro
# Endereco pelo qual as clientes acessam o chat (usado no link de confirmacao por WhatsApp)
studio.url-publica=${URL_PUBLICA:http://localhost:8080}
studio.abertura=09:00
studio.fechamento=19:00
studio.dias-funcionamento=TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY
studio.intervalo-minutos=30

# Login do painel administrativo (troque a senha!)
studio.admin-usuario=admin
studio.admin-senha=${LASH_ADMIN_SENHA:lash123}

# Modelo de IA usado pela atendente
studio.modelo-ia=claude-opus-5-5

# ---------- Banco de dados (arquivo local na pasta ./dados) ----------
spring.datasource.url=jdbc:h2:file:./dados/ysadepaula;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jackson.time-zone=America/Sao_Paulo
server.port=${PORT:8080}

# Sessão do painel: expira depois de 4 horas sem uso; cookie inacessível ao JavaScript
server.servlet.session.timeout=4h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# atrás do proxy HTTPS da hospedagem, gera links e redirecionamentos com https
server.forward-headers-strategy=framework
