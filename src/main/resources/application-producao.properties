# Perfil usado na hospedagem (ative com SPRING_PROFILES_ACTIVE=producao).
# Os valores vêm das variáveis de ambiente do servidor.

# Banco PostgreSQL do Supabase. Use os dados do "Session pooler" (Connect > Session pooler),
# que funciona em qualquer hospedagem; a conexão direta do plano gratuito só aceita IPv6.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORTA:5432}/${DB_NOME:postgres}?sslmode=require
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}
# o plano gratuito do Supabase limita as conexões simultâneas
spring.datasource.hikari.maximum-pool-size=5

# Sem valor padrão: o sistema não sobe em produção sem uma senha definida
studio.admin-senha=${LASH_ADMIN_SENHA}

server.servlet.session.cookie.secure=true
