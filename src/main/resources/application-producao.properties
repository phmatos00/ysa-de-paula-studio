# Perfil usado na hospedagem (ative com SPRING_PROFILES_ACTIVE=producao).
# Os valores vêm das variáveis de ambiente do servidor.

# Banco PostgreSQL (o Railway cria estas variáveis ao adicionar o banco ao serviço)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Sem valor padrão: o sistema não sobe em produção sem uma senha definida
studio.admin-senha=${LASH_ADMIN_SENHA}

server.servlet.session.cookie.secure=true
