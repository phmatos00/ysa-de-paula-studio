# Perfil usado na hospedagem (ativado por SPRING_PROFILES_ACTIVE=producao, que o Dockerfile já define).
# Os valores vêm das variáveis de ambiente do servidor e sobrescrevem os do application.yml.

spring:
  # Banco PostgreSQL do Supabase. Use os dados do "Session pooler" (Connect > Session pooler),
  # que funciona em qualquer hospedagem; a conexão direta do plano gratuito só aceita IPv6.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORTA:5432}/${DB_NOME:postgres}?sslmode=${DB_SSL:require}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}
    hikari:
      # o plano gratuito do Supabase limita as conexões simultâneas
      maximum-pool-size: 5

studio:
  # sem valor padrão: o sistema não sobe em produção sem uma senha definida
  admin-senha: ${LASH_ADMIN_SENHA}

server:
  servlet:
    session:
      cookie:
        # o cookie de login só trafega por HTTPS
        secure: true
