# Configuração do sistema. Este arquivo é lido em UTF-8: pode usar acentos à vontade.
# Atenção ao YAML: a indentação (2 espaços) faz parte da sintaxe, e horários vão entre aspas.

# ---------- Dados do studio (personalize aqui) ----------
studio:
  nome: Ysa de Paula
  profissional: Ysa
  # aparece embaixo do nome, no título das páginas e no rodapé
  especialidade: Lash Designer
  endereco: Quadra 14, Rua 10, Casa 39 - Boa Vista II, Novo Gama - GO, CEP 72862-114
  # WhatsApp do studio, com DDD (ex.: 11987654321). Vazio = não aparece no site
  whatsapp: ""
  # Instagram sem o @ (ex.: ysadepaula.lash). Vazio = não aparece no site
  instagram: ""
  # endereço pelo qual as clientes acessam o chat (vai no link de confirmação por WhatsApp)
  url-publica: ${URL_PUBLICA:http://localhost:8080}
  # horário de cada dia da semana; para fechar um dia, apague a linha dele
  horarios:
    MONDAY: {abertura: "18:40", fechamento: "21:00"}
    TUESDAY: {abertura: "18:40", fechamento: "21:00"}
    WEDNESDAY: {abertura: "18:40", fechamento: "21:00"}
    THURSDAY: {abertura: "18:40", fechamento: "21:00"}
    FRIDAY: {abertura: "18:40", fechamento: "21:00"}
    SATURDAY: {abertura: "08:00", fechamento: "21:00"}
    SUNDAY: {abertura: "08:00", fechamento: "21:00"}
  # de quantos em quantos minutos a agenda oferece horários
  intervalo-minutos: 30
  # de onde a profissional sai para o atendimento a domicílio (a distância é calculada a partir de cada um)
  pontos-partida:
    - nome: Studio (Boa Vista II)
      latitude: -16.049881
      longitude: -48.053676
    - nome: Aquarela Baby Gama
      latitude: -15.970700
      longitude: -48.042900

  # Login do painel administrativo (troque a senha!)
  admin-usuario: admin
  admin-senha: ${LASH_ADMIN_SENHA:lash123}

  # IA da atendente: qualquer API compatível com a da OpenAI. A chave vai na variável IA_API_KEY.
  # Padrão: Google Gemini, que tem plano gratuito (chave em https://aistudio.google.com/apikey)
  ia-url: ${IA_URL:https://generativelanguage.googleapis.com/v1beta/openai}
  modelo-ia: ${IA_MODELO:gemini-3.5-flash}
  # usado quando o modelo principal está sobrecarregado (comum no plano gratuito)
  modelo-ia-reserva: ${IA_MODELO_RESERVA:gemini-flash-lite-latest}

# ---------- Banco de dados (arquivo local na pasta ./dados) ----------
spring:
  datasource:
    url: jdbc:h2:file:./dados/ysadepaula;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    time-zone: America/Sao_Paulo

server:
  port: ${PORT:8080}
  # atrás do proxy HTTPS da hospedagem, gera links e redirecionamentos com https
  forward-headers-strategy: framework
  servlet:
    session:
      # sessão do painel: expira depois de 4 horas sem uso; cookie inacessível ao JavaScript
      timeout: 4h
      cookie:
        http-only: true
        same-site: lax
